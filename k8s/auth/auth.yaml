apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-app

  template:
    metadata:
      labels:
        app: auth-app

    spec:
      containers:
        - name: auth
          image: auth-image-placeholder:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: DATABASE_DSN
              value: "postgres://auth_user:auth_password@auth-db-service:5432/auth_db"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: default

spec:
  selector:
    app: auth-app

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080