apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: auth_user
            - name: POSTGRES_PASSWORD
              value: auth_password
            - name: POSTGRES_DB
              value: auth_db
          ports:
            - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: auth-db-service
  namespace: default
spec:
  selector:
    app: auth-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432